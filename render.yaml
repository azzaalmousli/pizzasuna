services:
  - type: web
    name: pizzasuna
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PIZZASUNA_ADMIN_PASSWORD
        generateValue: true
    disk:
      name: pizzasuna-data
      mountPath: /app/data
      sizeGB: 1
