<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizzasuna · Restaurant orders</title><link rel="stylesheet" href="admin.css"></head><body><header><a href="/">PIZZA<span>SUNA</span></a><button id="logout" hidden>Sign out</button></header><main><section id="loginPanel" class="login"><p class="eyebrow">YOUR RESTAURANT</p><h1>Orders, in one place.</h1><p>Sign in to see incoming pizzas and keep your kitchen moving.</p><form id="ownerLogin"><label for="ownerPassword">Owner password</label><input id="ownerPassword" type="password" autocomplete="current-password" required><button class="primary">Open dashboard →</button></form><p id="loginMessage" role="status"></p></section><section id="dashboard" hidden><div class="heading"><div><p class="eyebrow">THE KITCHEN DESK</p><h1>Today's rhythm.</h1></div><div class="actions"><button id="sound" aria-pressed="false">Enable sound</button><button id="refresh">Refresh orders</button></div></div><div class="stats"><article><span>Active orders</span><strong id="activeCount">0</strong></article><article><span>New orders</span><strong id="newCount">0</strong></article><article><span>Demo sales today</span><strong id="sales">₺0</strong><small>No payment collected</small></article></div><div class="toolbar"><label>Show <select id="filter"><option value="active">Active orders</option><option value="all">All recent orders</option><option>Delivered</option><option>Cancelled</option></select></label><p id="sync" role="status" aria-live="polite"></p></div><p id="notice" role="status" aria-live="polite"></p><div id="orders"></div></section></main><script src="admin.js"></script></body></html>
